name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app.py downloader.py search_channels.py rerank.py mdflatten.py cache_store.py version.py

      - name: Offline unit tests
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/test_downloader.py
          python tests/test_rerank.py
          python tests/test_canonical.py
          python tests/test_regressions.py
          python tests/test_summary.py
          python tests/test_window_interactions.py

      - name: Build exe (includes --selftest)
        shell: cmd
        run: build_exe.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-topic-searcher
          path: dist/wechat-topic-searcher.exe
